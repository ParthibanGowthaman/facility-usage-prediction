name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Dataset regenerates identically
        run: |
          PYTHONPATH=src python -m facility_pred.data_gen --out /tmp/data
          diff /tmp/data/bookings.csv data/bookings.csv
